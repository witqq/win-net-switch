name: Report a bug
description: A reproducible problem in an installed or portable WinNetSwitch build
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Do not publish passwords, tokens, MAC addresses, Wi-Fi network names, or other personal information. Report vulnerabilities through a GitHub Security Advisory.
  - type: input
    id: version
    attributes:
      label: WinNetSwitch version
      description: Find it in Windows Installed apps or on the GitHub Release page.
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2, build 26100
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Distribution
      options:
        - WinNetSwitch-Setup.exe installer
        - Portable WinNetSwitch.exe
        - Local build from source
    validations:
      required: true
  - type: textarea
    id: adapters
    attributes:
      label: Affected adapters
      description: List adapter types and models without MAC/IP addresses or Wi-Fi network names.
      placeholder: Integrated Intel Wi-Fi and wired Realtek Ethernet
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open the tray menu
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Sanitized log excerpt
      description: The log is in %LOCALAPPDATA%\WinNetSwitch\logs. Remove personal and network identifiers before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I am using the latest published version.
          required: true
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: This report and its log excerpt contain no secrets or personal data.
          required: true
