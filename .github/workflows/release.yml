name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v1.4.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: stream-deck-plugin/package-lock.json

      - name: Verify tag and project version
        shell: powershell
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH format: $env:RELEASE_TAG"
          }
          $project = [xml](Get-Content -Raw -LiteralPath 'Directory.Build.props')
          $projectVersion = [string]$project.Project.PropertyGroup.Version
          if ($env:RELEASE_TAG.Substring(1) -ne $projectVersion) {
            throw "Tag $env:RELEASE_TAG does not match project version $projectVersion."
          }

      - name: Restore
        run: dotnet restore .\WinNetSwitch.slnx

      - name: Build
        run: dotnet build .\WinNetSwitch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project .\tests\WinNetSwitch.Tests\WinNetSwitch.Tests.csproj --configuration Release --no-build

      - name: Install Stream Deck plugin dependencies
        working-directory: .\stream-deck-plugin
        run: npm ci

      - name: Typecheck and test Stream Deck plugin
        working-directory: .\stream-deck-plugin
        run: |
          npm run typecheck
          npm test

      - name: Package Stream Deck plugin
        working-directory: .\stream-deck-plugin
        run: npm run package

      - name: Verify Stream Deck plugin package
        shell: powershell
        run: .\scripts\test-stream-deck-package.ps1

      - name: Native tray smoke test
        run: dotnet run --project .\src\WinNetSwitch.App\WinNetSwitch.App.csproj --configuration Release --no-build -- --smoke-test

      - name: Native local control pipe smoke test
        run: dotnet run --project .\src\WinNetSwitch.App\WinNetSwitch.App.csproj --configuration Release --no-build -- --ipc-smoke-test

      - name: Publish application and installer
        shell: powershell
        run: .\scripts\publish.ps1

      - name: Published artifact self-tests
        shell: powershell
        run: |
          $checks = @(
            @{ File = 'artifacts\publish\win-x64\WinNetSwitch.exe'; Argument = '--logging-self-test' },
            @{ File = 'artifacts\publish\win-x64\WinNetSwitch.exe'; Argument = '--smoke-test' },
            @{ File = 'artifacts\publish\win-x64\WinNetSwitch.exe'; Argument = '--ipc-smoke-test' },
            @{ File = 'artifacts\setup\win-x64\WinNetSwitch-Setup.exe'; Argument = '--self-test' }
          )
          foreach ($check in $checks) {
            $process = Start-Process -FilePath $check.File -ArgumentList $check.Argument -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "$($check.File) $($check.Argument) failed with exit code $($process.ExitCode)."
            }
          }

      - name: Create checksums
        shell: powershell
        run: |
          $files = @(
            'artifacts\publish\win-x64\WinNetSwitch.exe',
            'artifacts\setup\win-x64\WinNetSwitch-Setup.exe',
            'artifacts\stream-deck\dev.witqq.win-net-switch.streamDeckPlugin'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii -LiteralPath 'artifacts\SHA256SUMS.txt'

      - name: Create GitHub Release
        shell: powershell
        run: |
          gh release create $env:RELEASE_TAG `
            'artifacts\setup\win-x64\WinNetSwitch-Setup.exe#Windows installer' `
            'artifacts\publish\win-x64\WinNetSwitch.exe#Portable self-contained application' `
            'artifacts\stream-deck\dev.witqq.win-net-switch.streamDeckPlugin#Stream Deck plugin' `
            'artifacts\SHA256SUMS.txt#SHA-256 checksums' `
            --verify-tag `
            --generate-notes `
            --notes "Code signing status and policy: https://github.com/witqq/win-net-switch/blob/$env:RELEASE_TAG/CODE_SIGNING_POLICY.md" `
            --title "WinNetSwitch $env:RELEASE_TAG"
