name: Request a feature
description: New functionality or a behavior change for WinNetSwitch
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should be solved?
      description: Describe the user scenario, not only the desired button or implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should the user observe, and how can the result be verified?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe an existing solution and its limitations.
  - type: checkboxes
    id: scope
    attributes:
      label: Checklist
      options:
        - label: This request concerns physical Windows network adapter management.
          required: true
        - label: I searched existing issues and found no equivalent request.
          required: true
